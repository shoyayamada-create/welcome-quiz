<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 歓迎会クイズ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Boogaloo&display=swap');

  :root {
    --primary: #FF4D6D;
    --secondary: #FFD700;
    --accent: #4CC9F0;
    --dark: #1a1a2e;
    --mid: #16213e;
    --card: #0f3460;
    --green: #06D6A0;
    --orange: #FF9F1C;
    --text: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; overflow-x: hidden; }

  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  .top-nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; background: rgba(0,0,0,0.3); border-bottom: 2px solid var(--secondary);
    flex-shrink: 0;
  }
  .nav-logo { font-family: 'Boogaloo', cursive; font-size: 1.4rem; color: var(--secondary); letter-spacing: 2px; }
  .nav-badge { background: var(--primary); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
  .ws-status { font-size: 0.7rem; padding: 3px 10px; border-radius: 20px; }
  .ws-status.connected { background: rgba(6,214,160,0.2); color: var(--green); border: 1px solid var(--green); }
  .ws-status.disconnected { background: rgba(255,77,109,0.2); color: var(--primary); border: 1px solid var(--primary); }

  /* ROLE SELECT */
  #screen-role { justify-content: center; align-items: center; background: radial-gradient(ellipse at center, #1a1a4e 0%, #0a0a1a 100%); }
  .role-container { text-align: center; padding: 40px 20px; }
  .role-title { font-family: 'Boogaloo', cursive; font-size: clamp(2rem, 8vw, 4rem); color: var(--secondary); text-shadow: 0 0 30px rgba(255,215,0,0.5); margin-bottom: 8px; animation: pulse-glow 2s ease-in-out infinite; }
  .role-sub { font-size: 1.1rem; color: rgba(255,255,255,0.7); margin-bottom: 50px; }
  @keyframes pulse-glow { 0%,100%{text-shadow:0 0 20px rgba(255,215,0,0.4)} 50%{text-shadow:0 0 50px rgba(255,215,0,0.9),0 0 80px rgba(255,215,0,0.3)} }
  .role-cards { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
  .role-card { background: var(--card); border: 3px solid transparent; border-radius: 20px; padding: 40px 50px; cursor: pointer; transition: all 0.3s; }
  .role-card:hover { transform: translateY(-8px) scale(1.03); }
  .role-card.admin { border-color: var(--primary); }
  .role-card.admin:hover { box-shadow: 0 20px 60px rgba(255,77,109,0.4); }
  .role-card.player { border-color: var(--accent); }
  .role-card.player:hover { box-shadow: 0 20px 60px rgba(76,201,240,0.4); }
  .role-emoji { font-size: 4rem; display: block; margin-bottom: 16px; }
  .role-name { font-size: 1.4rem; font-weight: 900; }
  .role-desc { font-size: 0.85rem; color: rgba(255,255,255,0.6); margin-top: 8px; }

  /* ADMIN */
  #screen-admin { background: linear-gradient(135deg, #0d1b2a, #1b2838); }
  .admin-body { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; max-width: 800px; margin: 0 auto; width: 100%; overflow-y: auto; }
  .status-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .status-pill { background: rgba(255,255,255,0.1); border-radius: 20px; padding: 6px 16px; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
  .status-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: blink 1.5s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .section-title { font-size: 0.75rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--secondary); margin-bottom: 10px; }
  .card-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; }
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 0.8rem; color: rgba(255,255,255,0.6); margin-bottom: 6px; }
  .form-input, .form-textarea { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: white; padding: 10px 14px; font-family: 'Noto Sans JP', sans-serif; font-size: 0.95rem; transition: border-color 0.2s; }
  .form-input:focus, .form-textarea:focus { outline: none; border-color: var(--secondary); }
  .form-textarea { resize: vertical; min-height: 70px; }
  .choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .choice-input-wrap { display: flex; align-items: center; gap: 8px; }
  .choice-label { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.9rem; flex-shrink: 0; }
  .choice-label.a { background: #e74c3c; } .choice-label.b { background: #3498db; } .choice-label.c { background: #2ecc71; } .choice-label.d { background: #f39c12; }
  .correct-select { display: flex; gap: 10px; flex-wrap: wrap; }
  .correct-btn { padding: 8px 20px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.2); background: transparent; color: white; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; font-weight: 700; transition: all 0.2s; }
  .correct-btn:hover { border-color: var(--secondary); }
  .correct-btn.selected { background: var(--green); border-color: var(--green); }
  .btn { padding: 12px 28px; border-radius: 12px; border: none; font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: #ff2d55; box-shadow: 0 4px 20px rgba(255,77,109,0.5); }
  .btn-secondary { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
  .btn-secondary:hover { background: rgba(255,255,255,0.2); }
  .btn-success { background: var(--green); color: #0a2a20; }
  .btn-success:hover { box-shadow: 0 4px 20px rgba(6,214,160,0.5); }
  .btn-warning { background: var(--secondary); color: #1a1a00; }
  .btn-warning:hover { box-shadow: 0 4px 20px rgba(255,215,0,0.5); }
  .btn-full { width: 100%; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .q-list { display: flex; flex-direction: column; gap: 8px; }
  .q-item { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 10px 14px; font-size: 0.9rem; }
  .q-num { width: 28px; height: 28px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.8rem; flex-shrink: 0; }
  .q-text { flex: 1; }
  .q-delete { background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; font-size: 1.1rem; padding: 4px; }
  .q-delete:hover { color: var(--primary); }
  .participant-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .participant-chip { background: var(--card); border-radius: 20px; padding: 6px 14px; font-size: 0.85rem; }

  /* JOIN */
  #screen-join { justify-content: center; align-items: center; background: radial-gradient(ellipse at center, #1a2a4e 0%, #0a0a1a 100%); }
  .join-box { text-align: center; padding: 40px 20px; max-width: 420px; width: 100%; }
  .join-emoji { font-size: 5rem; margin-bottom: 16px; }
  .join-title { font-family: 'Boogaloo', cursive; font-size: 2.5rem; color: var(--secondary); margin-bottom: 8px; }
  .join-sub { color: rgba(255,255,255,0.6); margin-bottom: 32px; }
  .name-input-wrap { display: flex; gap: 10px; margin-bottom: 16px; }
  .name-input { flex: 1; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); border-radius: 12px; color: white; padding: 14px 18px; font-family: 'Noto Sans JP', sans-serif; font-size: 1.1rem; transition: border-color 0.2s; }
  .name-input:focus { outline: none; border-color: var(--secondary); }
  .waiting-msg { margin-top: 24px; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 14px; display: none; }
  .waiting-msg.visible { display: block; }
  .waiting-dots::after { content: ''; animation: dots 1.5s steps(4,end) infinite; }
  @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} 100%{content:''} }

  /* ANSWER */
  #screen-answer { background: linear-gradient(135deg, #0d1b2a, #1b2838); }
  .answer-body { flex: 1; padding: 20px; display: flex; flex-direction: column; }
  .answer-q-num { font-size: 0.85rem; color: rgba(255,255,255,0.5); margin-bottom: 8px; }
  .answer-q-text { font-size: 1.2rem; font-weight: 700; line-height: 1.5; margin-bottom: 16px; }
  .answer-timer-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
  .answer-timer-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--secondary)); border-radius: 4px; transition: width 0.1s linear; }
  .answer-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; align-content: stretch; }
  .answer-choice-btn { border-radius: 16px; border: none; padding: 12px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: clamp(0.8rem, 3.5vw, 1.05rem); color: white; transition: all 0.15s; text-align: center; min-height: 0; flex: 1; }
  .answer-choice-btn:active { transform: scale(0.96); }
  .answer-choice-btn.a { background: #e74c3c; } .answer-choice-btn.b { background: #3498db; } .answer-choice-btn.c { background: #2ecc71; } .answer-choice-btn.d { background: #f39c12; }
  .answer-choice-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .answer-choice-btn.selected { box-shadow: 0 0 0 4px white, 0 0 30px rgba(255,255,255,0.3); }
  .answer-choice-btn.correct-hi { box-shadow: 0 0 0 4px var(--green), 0 0 30px rgba(6,214,160,0.5); }
  .answer-choice-btn.wrong-hi { opacity: 0.4; }
  .choice-btn-icon { font-size: clamp(1.4rem, 5vw, 2rem); line-height: 1; }

  /* SCOREBOARD */
  #screen-scoreboard { background: linear-gradient(135deg, #0d0d2b, #1a0a2e); }
  .scoreboard-body { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; max-width: 700px; margin: 0 auto; width: 100%; overflow-y: auto; }
  .scoreboard-title { font-family: 'Boogaloo', cursive; font-size: 2.5rem; color: var(--secondary); margin-bottom: 30px; text-align: center; }
  .score-list { width: 100%; }
  .score-row { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-radius: 14px; margin-bottom: 10px; animation: slide-in 0.4s ease-out both; }
  @keyframes slide-in { from{transform:translateX(-40px);opacity:0} to{transform:translateX(0);opacity:1} }
  .score-row:nth-child(1) { background: linear-gradient(90deg,rgba(255,215,0,0.3),rgba(255,215,0,0.05)); border: 2px solid rgba(255,215,0,0.5); }
  .score-row:nth-child(2) { background: linear-gradient(90deg,rgba(192,192,192,0.2),transparent); border: 1px solid rgba(192,192,192,0.3); }
  .score-row:nth-child(3) { background: linear-gradient(90deg,rgba(205,127,50,0.2),transparent); border: 1px solid rgba(205,127,50,0.3); }
  .score-row:nth-child(n+4) { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
  .score-rank { font-family: 'Boogaloo', cursive; font-size: 1.8rem; width: 40px; text-align: center; }
  .score-rank.gold{color:var(--secondary)} .score-rank.silver{color:#c0c0c0} .score-rank.bronze{color:#cd7f32}
  .score-name { flex: 1; font-weight: 700; font-size: 1.1rem; }
  .score-pts { font-family: 'Boogaloo', cursive; font-size: 1.6rem; color: var(--accent); }
  .score-pts-label { font-size: 0.7rem; color: rgba(255,255,255,0.5); }

  /* FINAL */
  #screen-final { background: radial-gradient(ellipse at center, #1a2a0e, #0a0a1a); align-items: center; justify-content: flex-start; text-align: center; overflow-y: auto; }
  .final-body { padding: 40px 20px; max-width: 600px; position: relative; z-index: 1; width: 100%; }
  .final-crown { font-size: 8rem; margin-bottom: 16px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
  .final-winner-label { font-size: 1rem; color: rgba(255,255,255,0.6); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; }
  .final-winner-name { font-family: 'Boogaloo', cursive; font-size: clamp(2.5rem,10vw,5rem); color: var(--secondary); text-shadow: 0 0 40px rgba(255,215,0,0.6); margin-bottom: 8px; }
  .final-winner-pts { font-size: 1.3rem; color: rgba(255,255,255,0.7); margin-bottom: 40px; }
  .final-top3 { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 40px; }
  .final-podium { text-align: center; }
  .final-podium-rank { font-size: 2rem; }
  .final-podium-name { font-weight: 700; font-size: 1rem; margin-top: 4px; }
  .final-podium-pts { font-size: 0.85rem; color: rgba(255,255,255,0.6); }
  .confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 0; }
  .confetti-piece { position: absolute; top: -20px; animation: confetti-fall linear infinite; }
  @keyframes confetti-fall { to{transform:translateY(110vh) rotate(720deg)} }

  /* RESULT OVERLAY */
  .result-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; }
  .result-overlay.show { display: flex; }
  .result-box { text-align: center; padding: 50px 40px; border-radius: 24px; max-width: 360px; width: 90%; animation: pop-in 0.5s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes pop-in { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
  .result-box.correct-res { background: linear-gradient(135deg,#0a3d2e,#0f5233); border: 3px solid var(--green); }
  .result-box.wrong-res { background: linear-gradient(135deg,#3d0a0a,#520f0f); border: 3px solid var(--primary); }
  .result-box.timeout-res { background: linear-gradient(135deg,#2a2a0a,#33330f); border: 3px solid var(--secondary); }
  .result-emoji { font-size: 5rem; margin-bottom: 16px; }
  .result-title { font-size: 1.8rem; font-weight: 900; margin-bottom: 8px; }
  .result-points { font-size: 1.1rem; color: rgba(255,255,255,0.7); }
  .result-big-pts { font-family: 'Boogaloo', cursive; font-size: 3rem; color: var(--secondary); }

  @keyframes badge-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.7;transform:scale(1.08)} }

  @media(max-width:480px){
    .role-cards{flex-direction:column}
    .role-card{padding:28px 36px}
    .answer-choices{grid-template-columns:1fr}
    .choices-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- ROLE SELECT -->
<div id="screen-role" class="screen active">
  <div class="role-container">
    <div class="role-title">🎉 歓迎会クイズ！</div>
    <div class="role-sub">どちらとして参加しますか？</div>
    <div class="role-cards">
      <div class="role-card admin" onclick="goAdmin()">
        <span class="role-emoji">👑</span>
        <div class="role-name">管理者</div>
        <div class="role-desc">クイズを作って進行する</div>
      </div>
      <div class="role-card player" onclick="goJoin()">
        <span class="role-emoji">🎮</span>
        <div class="role-name">参加者</div>
        <div class="role-desc">クイズに答える</div>
      </div>
    </div>
    <div id="ws-connect-status" style="margin-top:30px;font-size:0.85rem;color:rgba(255,255,255,0.4)">サーバーに接続中<span class="waiting-dots"></span></div>
  </div>
</div>

<!-- ADMIN -->
<div id="screen-admin" class="screen">
  <div class="top-nav">
    <div class="nav-logo">🎯 管理者パネル</div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="nav-badge" id="admin-player-count">参加者 0人</div>
      <div class="ws-status disconnected" id="admin-ws-status">●</div>
    </div>
  </div>
  <div class="admin-body">
    <div class="status-bar">
      <div class="status-pill"><div class="dot"></div>ライブ</div>
      <div class="status-pill" id="admin-phase-pill">待機中</div>
    </div>
    <div>
      <div class="section-title">📝 問題を追加</div>
      <div class="card-box">
        <div class="form-group">
          <label class="form-label">問題文</label>
          <textarea class="form-textarea" id="q-text" placeholder="例：大原さんの出身地は？"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">選択肢</label>
          <div class="choices-grid">
            <div class="choice-input-wrap"><div class="choice-label a">A</div><input class="form-input" id="c-a" placeholder="選択肢A"></div>
            <div class="choice-input-wrap"><div class="choice-label b">B</div><input class="form-input" id="c-b" placeholder="選択肢B"></div>
            <div class="choice-input-wrap"><div class="choice-label c">C</div><input class="form-input" id="c-c" placeholder="選択肢C"></div>
            <div class="choice-input-wrap"><div class="choice-label d">D</div><input class="form-input" id="c-d" placeholder="選択肢D"></div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">正解</label>
          <div class="correct-select">
            <button class="correct-btn" data-v="0" onclick="selectCorrect(this)">A</button>
            <button class="correct-btn" data-v="1" onclick="selectCorrect(this)">B</button>
            <button class="correct-btn" data-v="2" onclick="selectCorrect(this)">C</button>
            <button class="correct-btn" data-v="3" onclick="selectCorrect(this)">D</button>
          </div>
        </div>
        <button class="btn btn-primary" onclick="addQuestion()">＋ 追加</button>
      </div>
    </div>
    <div>
      <div class="section-title">📋 問題リスト（<span id="q-count">0</span>問）</div>
      <div class="q-list" id="q-list"></div>
    </div>
    <div>
      <div class="section-title">🎛️ 進行コントロール</div>
      <div class="card-box">
        <div class="btn-row">
          <button class="btn btn-warning" onclick="startNextQuestion()" id="btn-next">▶ 次の問題を開始</button>
          <button class="btn btn-success" onclick="revealAnswer()" id="btn-reveal" style="display:none">✅ 正解発表</button>
          <button class="btn btn-primary" onclick="doShowScoreboard()" id="btn-score" style="display:none">🏆 スコアボード</button>
          <button class="btn btn-secondary" onclick="doShowFinal()" id="btn-final" style="display:none">🎊 最終結果</button>
        </div>
        <div style="margin-top:12px;font-size:0.8rem;color:rgba(255,255,255,0.4)" id="admin-status-text">問題を追加して「次の問題を開始」を押してください</div>
      </div>
    </div>
    <div>
      <div class="section-title">👥 参加者（<span id="part-count">0</span>人）</div>
      <div class="participant-list" id="participant-list"></div>
    </div>
    <div style="padding-bottom:20px">
      <button class="btn btn-secondary btn-full" onclick="doReset()" style="opacity:0.6">🔄 ゲームをリセット</button>
    </div>
  </div>
</div>

<!-- JOIN -->
<div id="screen-join" class="screen">
  <div class="top-nav">
    <div class="nav-logo">🎉 歓迎会クイズ</div>
    <div class="ws-status disconnected" id="join-ws-status">●</div>
  </div>
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:20px;">
    <div class="join-box">
      <div class="join-emoji">🙋</div>
      <div class="join-title">参加登録</div>
      <div class="join-sub">あなたの名前を入力してください</div>
      <div class="name-input-wrap" id="name-input-wrap">
        <input class="name-input" id="player-name" placeholder="山田 翔也" maxlength="20" onkeydown="if(event.key==='Enter')joinGame()">
        <button class="btn btn-primary" onclick="joinGame()">参加！</button>
      </div>
      <div class="waiting-msg" id="waiting-msg">
        <div style="font-size:2rem;margin-bottom:8px;">⏳</div>
        <div style="font-weight:700;margin-bottom:4px;" id="joined-name-display"></div>
        <div style="color:rgba(255,255,255,0.6);font-size:0.9rem;">ゲーム開始を待っています<span class="waiting-dots"></span></div>
        <div style="margin-top:16px;font-size:0.85rem;color:rgba(255,255,255,0.4)">参加者: <span id="waiting-count">0</span>人</div>
      </div>
    </div>
  </div>
</div>

<!-- ANSWER -->
<div id="screen-answer" class="screen">
  <div class="top-nav">
    <div class="nav-logo">🎯 クイズ回答</div>
    <div class="nav-badge" id="player-score-badge">0pt</div>
  </div>
  <div class="answer-body">
    <div class="answer-q-num" id="answer-q-num">Q1 / 5</div>
    <div class="answer-q-text" id="answer-q-text"></div>
    <div class="answer-timer-bar"><div class="answer-timer-fill" id="answer-timer-fill" style="width:100%"></div></div>
    <div class="answer-choices" id="answer-choices"></div>
  </div>
</div>

<!-- SCOREBOARD -->
<div id="screen-scoreboard" class="screen">
  <div class="top-nav"><div class="nav-logo">🏆 スコアボード</div></div>
  <div class="scoreboard-body">
    <div class="scoreboard-title">現在のランキング</div>
    <div class="score-list" id="score-list"></div>
    <div style="margin-top:24px;width:100%">
      <button class="btn btn-secondary btn-full" id="back-from-score" onclick="backFromScore()">← 戻る（管理者のみ）</button>
    </div>
  </div>
</div>

<!-- FINAL -->
<div id="screen-final" class="screen">
  <div class="confetti" id="confetti"></div>
  <div class="final-body">
    <div class="final-crown">👑</div>
    <div class="final-winner-label">🎊 優勝者 🎊</div>
    <div class="final-winner-name" id="final-winner-name">???</div>
    <div class="final-winner-pts" id="final-winner-pts"></div>
    <div class="final-top3" id="final-top3"></div>
    <!-- 管理者用全員ランキング -->
    <div id="final-admin-ranking" style="display:none;width:100%;max-width:500px;margin:0 auto 24px;">
      <div style="font-size:0.75rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#FFD700;margin-bottom:12px;text-align:left">👑 全員の最終スコア（管理者のみ表示）</div>
      <div id="final-all-scores"></div>
    </div>
    <button class="btn btn-secondary" onclick="doReset()">🔄 もう一度</button>
  </div>
</div>

<!-- RESULT OVERLAY -->
<div class="result-overlay" id="result-overlay">
  <div class="result-box" id="result-box">
    <div class="result-emoji" id="result-emoji"></div>
    <div class="result-title" id="result-title"></div>
    <div class="result-points" id="result-points"></div>
  </div>
</div>

<script>
// ===== WS =====
let ws = null;
let myRole = null;
let myName = '';
let myAnsweredThisRound = false;
let timerInterval = null;
let selectedCorrect = null;
let lastPhase = null;
let lastQIndex = -1;
let state = null;

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen = () => {
    setWsStatus(true);
    document.getElementById('ws-connect-status').textContent = '✅ サーバーに接続しました！';
  };

  ws.onclose = () => {
    setWsStatus(false);
    setTimeout(connectWS, 2000);
  };

  ws.onerror = () => setWsStatus(false);

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'state') handleStateUpdate(msg.state);
  };
}

function send(obj) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
}

function setWsStatus(connected) {
  ['admin-ws-status','join-ws-status'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.className = 'ws-status ' + (connected ? 'connected' : 'disconnected');
    el.textContent = connected ? '● 接続中' : '● 切断';
  });
}

// ===== SCREENS =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

function goAdmin() { myRole = 'admin'; showScreen('admin'); }
function goJoin() { myRole = 'player'; showScreen('join'); }

// ===== JOIN =====
function joinGame() {
  const name = document.getElementById('player-name').value.trim();
  if (!name) { alert('名前を入力してください'); return; }
  myName = name;
  send({ type: 'join', name });
  document.getElementById('joined-name-display').textContent = '✅ ' + name + ' として参加！';
  document.getElementById('waiting-msg').classList.add('visible');
  document.getElementById('name-input-wrap').style.display = 'none';
}

// ===== STATE HANDLER =====
function handleStateUpdate(s) {
  state = s;
  updateAdminUI(s);

  if (myRole === 'player' && myName) {
    // New question
    if (s.phase === 'question' && s.currentQIndex !== lastQIndex) {
      lastQIndex = s.currentQIndex;
      myAnsweredThisRound = !!s.answers[myName];
      document.getElementById('result-overlay').classList.remove('show');
      renderAnswerScreen(s);
      showScreen('answer');
    }
    // Reveal
    if (s.phase === 'reveal' && lastPhase !== 'reveal') {
      showRevealResult(s);
    }
    // Scoreboard
    if (s.phase === 'scoreboard') {
      document.getElementById('result-overlay').classList.remove('show');
      renderScoreboard(s);
      showScreen('scoreboard');
      document.getElementById('back-from-score').style.display = 'none';
    }
    // Final
    if (s.phase === 'final') {
      renderFinal(s);
      showScreen('final');
    }
    // Reset to waiting
    if (s.phase === 'waiting' && lastPhase && lastPhase !== 'waiting') {
      myAnsweredThisRound = false;
      lastQIndex = -1;
      document.getElementById('result-overlay').classList.remove('show');
      document.getElementById('waiting-msg').classList.remove('visible');
      document.getElementById('name-input-wrap').style.display = 'flex';
      myName = '';
      showScreen('join');
    }
    // Update score badge
    if (state) updateScoreBadge(state);
    document.getElementById('waiting-count').textContent = Object.keys(s.players).length;
  }

  lastPhase = s.phase;
}

function updateAdminUI(s) {
  if (myRole !== 'admin') return;
  const pc = Object.keys(s.players).length;
  document.getElementById('admin-player-count').textContent = `参加者 ${pc}人`;
  document.getElementById('part-count').textContent = pc;
  document.getElementById('q-count').textContent = s.questions.length;

  // Participant chips
  document.getElementById('participant-list').innerHTML =
    Object.keys(s.players).map(n => `<div class="participant-chip">🙋 ${n}</div>`).join('');

  // Q list
  const ql = document.getElementById('q-list');
  ql.innerHTML = s.questions.length === 0
    ? '<div style="color:rgba(255,255,255,0.4);font-size:0.9rem;padding:8px">まだ問題がありません</div>'
    : s.questions.map((q, i) => `
        <div class="q-item">
          <div class="q-num">${i+1}</div>
          <div class="q-text">${q.text}</div>
          <button class="q-delete" onclick="deleteQuestion(${i})">✕</button>
        </div>`).join('');

  // Phase label
  const phaseLabels = { waiting:'待機中', question:'問題回答中', reveal:'正解発表中', scoreboard:'スコアボード', final:'最終結果' };
  document.getElementById('admin-phase-pill').textContent = phaseLabels[s.phase] || s.phase;

  // Buttons
  const isQ = s.phase === 'question';
  const isR = s.phase === 'reveal';
  const isS = s.phase === 'scoreboard';
  const hasMoreQ = s.currentQIndex < s.questions.length - 1;
  const ansCount = Object.keys(s.answers).length;
  document.getElementById('btn-next').style.display = (s.phase === 'waiting' || isR || isS) && hasMoreQ ? 'inline-block' : 'none';
  document.getElementById('btn-reveal').style.display = isQ ? 'inline-block' : 'none';
  document.getElementById('btn-score').style.display = (isQ || isR) ? 'inline-block' : 'none';
  document.getElementById('btn-final').style.display = (isR || isS) && !hasMoreQ ? 'inline-block' : 'none';

  if (isQ) {
    document.getElementById('admin-status-text').textContent = `Q${s.currentQIndex+1} 回答受付中 (${ansCount}/${pc}人回答済)`;
  } else if (isR) {
    document.getElementById('admin-status-text').textContent = `Q${s.currentQIndex+1} 正解発表済み`;
  }
}

// ===== ADMIN ACTIONS =====
function selectCorrect(btn) {
  document.querySelectorAll('.correct-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedCorrect = parseInt(btn.dataset.v);
}

function addQuestion() {
  const text = document.getElementById('q-text').value.trim();
  const choices = ['a','b','c','d'].map(l => document.getElementById('c-'+l).value.trim());
  if (!text) { alert('問題文を入力してください'); return; }
  if (choices.some(c => !c)) { alert('全ての選択肢を入力してください'); return; }
  if (selectedCorrect === null) { alert('正解を選んでください'); return; }
  send({ type: 'add_question', text, choices, correct: selectedCorrect });
  document.getElementById('q-text').value = '';
  ['a','b','c','d'].forEach(l => document.getElementById('c-'+l).value = '');
  document.querySelectorAll('.correct-btn').forEach(b => b.classList.remove('selected'));
  selectedCorrect = null;
}

function deleteQuestion(idx) { send({ type: 'delete_question', index: idx }); }
function startNextQuestion() { send({ type: 'start_question' }); }
function revealAnswer() { send({ type: 'reveal_answer' }); }
function doShowScoreboard() {
  send({ type: 'show_scoreboard' });
  renderScoreboard(state);
  showScreen('scoreboard');
  document.getElementById('back-from-score').style.display = 'block';
}
function doShowFinal() { send({ type: 'show_final' }); }
function doReset() { if(confirm('本当にリセットしますか？')) send({ type: 'reset' }); }
function backFromScore() { showScreen('admin'); }

// ===== ANSWER SCREEN =====
function renderAnswerScreen(s) {
  const q = s.questions[s.currentQIndex];
  const icons = ['🔴','🔵','🟢','🟡'];
  document.getElementById('answer-q-num').textContent = `Q${s.currentQIndex+1} / ${s.questions.length}`;
  document.getElementById('answer-q-text').textContent = q.text;
  updateScoreBadge(s);

  const myAns = s.answers[myName];
  document.getElementById('answer-choices').innerHTML = q.choices.map((c, i) => `
    <button class="answer-choice-btn ${['a','b','c','d'][i]} ${myAns!==undefined && i===myAns.choice ? 'selected' : ''}"
      onclick="submitAnswer(${i})"
      ${myAns !== undefined ? 'disabled' : ''}>
      <div class="choice-btn-icon">${icons[i]}</div>
      <div>${c}</div>
    </button>`).join('');

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!state || state.phase !== 'question') { clearInterval(timerInterval); return; }
    const pct = Math.max(0, 1 - (Date.now() - state.questionStartTime) / (state.timeLimit * 1000));
    const fill = document.getElementById('answer-timer-fill');
    if (fill) fill.style.width = (pct * 100) + '%';
  }, 100);
}

function submitAnswer(choice) {
  if (myAnsweredThisRound) return;
  myAnsweredThisRound = true;
  if (timerInterval) clearInterval(timerInterval);
  send({ type: 'submit_answer', name: myName, choice });
  document.querySelectorAll('.answer-choice-btn').forEach((b, i) => {
    b.disabled = true;
    if (i === choice) b.classList.add('selected');
  });
  // Show pending
  showResultMsg('pending');
}

// スコアを隠すべきか判定（3問目以降は参加者に非表示）
const SCORE_HIDE_FROM_Q = 2; // 0-indexed: 2 = 3問目
function isScoreHidden(s) {
  return myRole === 'player' && s.currentQIndex >= SCORE_HIDE_FROM_Q;
}

function updateScoreBadge(s) {
  const badge = document.getElementById('player-score-badge');
  if (!badge) return;
  if (isScoreHidden(s)) {
    badge.textContent = '???';
    badge.style.letterSpacing = '2px';
    badge.style.background = 'linear-gradient(90deg, #7B2D8B, #FF4D6D)';
    badge.style.animation = 'badge-pulse 1.5s ease-in-out infinite';
  } else {
    badge.textContent = (s.players[myName] || 0) + 'pt';
    badge.style.letterSpacing = '';
    badge.style.background = '';
    badge.style.animation = '';
  }
}

function showRevealResult(s) {
  const q = s.questions[s.currentQIndex];
  const myAns = s.answers[myName];
  document.querySelectorAll('.answer-choice-btn').forEach((b, i) => {
    if (i === q.correct) b.classList.add('correct-hi');
    else if (myAns && i === myAns.choice && i !== q.correct) b.classList.add('wrong-hi');
  });
  const pts = s.players[myName] || 0;
  updateScoreBadge(s);
  const correctText = q.choices[q.correct]; // 正解の選択肢テキスト
  if (!myAns) showResultMsg('timeout', { correctText }, s);
  else if (myAns.choice === q.correct) showResultMsg('correct', { pts, correctText }, s);
  else showResultMsg('wrong', { correctIndex: q.correct, correctText }, s);
}

function showResultMsg(type, data, s) {
  const overlay = document.getElementById('result-overlay');
  const box = document.getElementById('result-box');
  overlay.classList.add('show');
  box.className = 'result-box';
  const hidden = s && isScoreHidden(s);
  const correctLabel = data && data.correctText
    ? `<div style="margin-top:12px;padding:10px 16px;background:rgba(255,255,255,0.1);border-radius:10px;font-size:0.95rem;">✅ 正解は「<strong>${data.correctText}</strong>」でした！</div>`
    : '';
  if (type === 'pending') {
    box.classList.add('timeout-res');
    document.getElementById('result-emoji').textContent = '⏳';
    document.getElementById('result-title').textContent = '回答済み！';
    document.getElementById('result-points').textContent = '正解発表を待っています...';
  } else if (type === 'correct') {
    box.classList.add('correct-res');
    document.getElementById('result-emoji').textContent = '🎉';
    document.getElementById('result-title').textContent = '正解！';
    if (hidden) {
      document.getElementById('result-points').innerHTML = `<span class="result-big-pts" style="font-size:2rem;letter-spacing:4px">🔒 ???pt</span><div style="font-size:0.8rem;margin-top:8px;opacity:0.6">最終発表までのお楽しみ！</div>${correctLabel}`;
    } else {
      document.getElementById('result-points').innerHTML = `<span class="result-big-pts">${data.pts.toLocaleString()}pt</span>${correctLabel}`;
    }
  } else if (type === 'wrong') {
    box.classList.add('wrong-res');
    document.getElementById('result-emoji').textContent = '😢';
    document.getElementById('result-title').textContent = '不正解...';
    document.getElementById('result-points').innerHTML = correctLabel;
  } else if (type === 'timeout') {
    box.classList.add('timeout-res');
    document.getElementById('result-emoji').textContent = '⏰';
    document.getElementById('result-title').textContent = '時間切れ！';
    document.getElementById('result-points').innerHTML = `次は間に合わせよう！${correctLabel}`;
  }
}

// ===== SCOREBOARD =====
function renderScoreboard(s) {
  const sorted = Object.entries(s.players).sort((a,b) => b[1]-a[1]);
  const medals = ['🥇','🥈','🥉'];
  const rankClass = ['gold','silver','bronze'];
  const hideScores = isScoreHidden(s);
  document.getElementById('score-list').innerHTML = sorted.map(([name, score], i) => `
    <div class="score-row" style="animation-delay:${i*0.08}s">
      <div class="score-rank ${rankClass[i]||''}">${medals[i]||(i+1)}</div>
      <div class="score-name">${name}${name===myName?' 👈':''}</div>
      <div style="text-align:right">
        ${hideScores
          ? `<div class="score-pts" style="letter-spacing:3px;background:linear-gradient(90deg,#7B2D8B,#FF4D6D);-webkit-background-clip:text;-webkit-text-fill-color:transparent">???</div>`
          : `<div class="score-pts">${score.toLocaleString()}</div><div class="score-pts-label">pt</div>`
        }
      </div>
    </div>`).join('') || '<div style="color:rgba(255,255,255,0.4)">まだ参加者がいません</div>';

  // 隠れている場合は煽りメッセージ追加
  if (hideScores && myRole === 'player') {
    const hint = document.createElement('div');
    hint.style.cssText = 'text-align:center;margin-top:20px;padding:16px;background:rgba(123,45,139,0.2);border:1px solid rgba(123,45,139,0.4);border-radius:12px;font-size:0.9rem;color:rgba(255,255,255,0.7);';
    hint.innerHTML = '🔒 スコアは最終発表まで非公開です！<br>最後まで諦めずに！';
    document.getElementById('score-list').after(hint);
  }
}

// ===== FINAL =====
function renderFinal(s) {
  const sorted = Object.entries(s.players).sort((a,b) => b[1]-a[1]);
  if (!sorted.length) return;
  document.getElementById('final-winner-name').textContent = sorted[0][0];
  document.getElementById('final-winner-pts').textContent = sorted[0][1].toLocaleString() + ' pt';
  const podiums = ['🥇','🥈','🥉'];
  document.getElementById('final-top3').innerHTML = sorted.slice(0,3).map(([name,score],i) => `
    <div class="final-podium">
      <div class="final-podium-rank">${podiums[i]}</div>
      <div class="final-podium-name">${name}</div>
      <div class="final-podium-pts">${score.toLocaleString()}pt</div>
    </div>`).join('');

  // 管理者のみ：全員スコア一覧を表示
  const adminRanking = document.getElementById('final-admin-ranking');
  if (myRole === 'admin') {
    adminRanking.style.display = 'block';
    const medals = ['🥇','🥈','🥉'];
    const rankClass = ['gold','silver','bronze'];
    document.getElementById('final-all-scores').innerHTML = sorted.map(([name, score], i) => `
      <div class="score-row" style="animation-delay:${i*0.06}s;margin-bottom:8px">
        <div class="score-rank ${rankClass[i]||''}">${medals[i]||(i+1)}</div>
        <div class="score-name">${name}</div>
        <div style="text-align:right">
          <div class="score-pts">${score.toLocaleString()}</div>
          <div class="score-pts-label">pt</div>
        </div>
      </div>`).join('');
  } else {
    adminRanking.style.display = 'none';
  }
  // Confetti
  const c = document.getElementById('confetti');
  c.innerHTML = '';
  const colors = ['#FFD700','#FF4D6D','#4CC9F0','#06D6A0','#FF9F1C'];
  for (let i = 0; i < 80; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.cssText = `left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*5)]};border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*2}s;width:${8+Math.random()*12}px;height:${8+Math.random()*12}px;`;
    c.appendChild(p);
  }
}

connectWS();
</script>
</body>
</html>
